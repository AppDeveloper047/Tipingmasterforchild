<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Typing Master</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        h1 {
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            font-size: 2.5rem;
        }
        .screen {
            width: 85vw;
            height: 60vh;
            background-color: #ffffff;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 8px solid #ff6b6b;
            position: relative;
        }
        #output {
            font-size: 15rem;
            font-weight: bold;
            color: #4ecdc4;
            text-shadow: 4px 4px 0px #ff6b6b;
            text-align: center;
            text-transform: uppercase;
        }
        .instruction {
            margin-top: 25px;
            font-size: 1.8rem;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 30px;
            border-radius: 50px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <h1>🎈 Bachcho ka Typing Master 🎈</h1>

    <div class="screen">
        <div id="output">ABC</div>
    </div>

    <div class="instruction">Keyboard par koi bhi button dabayein! ⌨️</div>

    <script>
        const output = document.getElementById('output');

        // आवाज़ (Speech Synthesis) के लिए फंक्शन
        function speakText(text) {
            if ('speechSynthesis' in window) {
                // अगर पहले से कोई आवाज़ बोल रही हो तो उसे रोकें
                window.speechSynthesis.cancel();
                
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US'; // अक्षर साफ़ बोलने के लिए
                utterance.rate = 0.8; // गति थोड़ी धीमी ताकि बच्चा आसानी से समझ सके
                window.speechSynthesis.speak(utterance);
            }
        }

        // कीबोर्ड की बटन दबाने पर क्या होगा
        window.addEventListener('keydown', function(event) {
            let key = event.key;

            // स्पेसबार या अन्य विशेष कुंजियों के लिए सुंदर टेक्स्ट दिखाना
            if (key === ' ') {
                output.innerText = "SPACE";
                speakText("Space");
            } else if (event.key.length === 1) {
                // सिर्फ साधारण अक्षरों और अंकों के लिए
                output.innerText = key;
                speakText(key);
            } else {
                // अन्य बड़ी कुंजियाँ (जैसे Enter, Shift आदि)
                output.innerText = key;
                speakText(key);
            }

            // हल्का सा रंग बदलने का इफ़ेक्ट (Animation)
            output.style.transform = "scale(1.2)";
            setTimeout(() => {
                output.style.transform = "scale(1)";
            }, 150);
        });
    </script>

</body>
</html>
