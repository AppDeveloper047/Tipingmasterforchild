<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Magic Typing Master</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        h1 {
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            font-size: 2rem;
        }
        .screen {
            width: 95vw;
            height: 70vh;
            background-color: #ffffff;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 8px solid #ff6b6b;
            padding: 10px;
        }
        /* बाईं तरफ का हिस्सा (टेक्स्ट के लिए) */
        .left-box {
            flex: 0 0 40%; /* स्क्रीन का 40% हिस्सा */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-right: 4px dashed #ffcccb;
            height: 100%;
        }
        #output {
            font-size: 8rem; /* अक्षर और बड़ा */
            font-weight: bold;
            color: #ff6b6b;
            text-transform: uppercase;
            line-height: 1;
        }
        #subtext {
            font-size: 2.2rem;
            color: #4ecdc4;
            margin-top: 15px;
            font-weight: bold;
        }

        /* दाईं तरफ का हिस्सा (बहुत बड़ी फोटो/इमोजी के लिए) */
        .right-box {
            flex: 0 0 58%; /* स्क्रीन का 58% हिस्सा */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            overflow: hidden; /* ताकि बड़ी चीज़ें बाहर न निकलें */
        }
        #visual-scratch {
            font-size: 25vmax; /* स्क्रीन के हिसाब से सबसे बड़ा साइज़ */
            text-align: center;
            line-height: 1;
            /* टेक्स्ट और इमोजी को सेंटर में रखने के लिए */
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        
        .instruction {
            margin-top: 10px;
            font-size: 1.3rem;
            color: #333;
            background: rgba(255, 255, 255, 0.9);
            padding: 5px 20px;
            border-radius: 50px;
        }
    </style>
</head>
<body>

    <h1>🎈 Bachcho ka Magic Typing Master 🎈</h1>

    <div class="screen">
        <!-- लेफ्ट साइड: टेक्स्ट -->
        <div class="left-box">
            <div id="output">ABC</div>
            <div id="subtext">Press any key!</div>
        </div>

        <!-- राइट साइड: बहुत बड़ी फोटो/इमोजी -->
        <div class="right-box">
            <div id="visual-scratch">🤩</div>
        </div>
    </div>

    <div class="instruction">Keyboard par button dabayein!</div>

    <script>
        const output = document.getElementById('output');
        const subtext = document.getElementById('subtext');
        const visualScratch = document.getElementById('visual-scratch');

        const kidsData = {
            'a': { text: 'A for Apple', emoji: '🍎', speak: 'A for Apple' },
            'b': { text: 'B for Ball', emoji: '⚽', speak: 'B for Ball' },
            'c': { text: 'C for Cat', emoji: '🐱', speak: 'C for Cat' },
            'd': { text: 'D for Dog', emoji: '🐶', speak: 'D for Dog' },
            'e': { text: 'E for Elephant', emoji: '🐘', speak: 'E for Elephant' },
            'f': { text: 'F for Fish', emoji: '🐟', speak: 'F for Fish' },
            'g': { text: 'G for Grapes', emoji: '🍇', speak: 'G for Grapes' },
            'h': { text: 'H for Horse', emoji: '🐴', speak: 'H for Horse' },
            'i': { text: 'I for Ice Cream', emoji: '🍦', speak: 'I for Ice Cream' },
            'j': { text: 'J for Jug', emoji: '🏺', speak: 'J for Jug' },
            'k': { text: 'K for Kite', emoji: '🪁', speak: 'K for Kite' },
            'l': { text: 'L for Lion', emoji: '🦁', speak: 'L for Lion' },
            'm': { text: 'M for Monkey', emoji: '🐵', speak: 'M for Monkey' },
            'n': { text: 'N for Nest', emoji: '🪹', speak: 'N for Nest' },
            'o': { text: 'O for Owl', emoji: '🦉', speak: 'O for Owl' },
            'p': { text: 'P for Parrot', emoji: '🦜', speak: 'P for Parrot' },
            'q': { text: 'Q for Queen', emoji: '👑', speak: 'Q for Queen' },
            'r': { text: 'R for Rose', emoji: '🌹', speak: 'R for Rose' },
            's': { text: 'S for Sun', emoji: '☀️', speak: 'S for Sun' },
            't': { text: 'T for Train', emoji: '🚂', speak: 'T for Train' },
            'u': { text: 'U for Umbrella', emoji: '☂️', speak: 'U for Umbrella' },
            'v': { text: 'V for Van', emoji: '🚐', speak: 'V for Van' },
            'w': { text: 'W for Watch', emoji: '⌚', speak: 'W for Watch' },
            'x': { text: 'X for Xylophone', emoji: '🪘', speak: 'X for Xylophone' },
            'y': { text: 'Y for Yak', emoji: '🐂', speak: 'Y for Yak' },
            'z': { text: 'Z for Zebra', emoji: '🦓', speak: 'Z for Zebra' }
        };

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            }
        }

        window.addEventListener('keydown', function(event) {
            let key = event.key.toLowerCase();

            // विशेष कोड: अगर स्टार्स बहुत ज़्यादा हों, तो उनका साइज़ थोड़ा कम करें ताकि वे स्क्रीन में फिट रहें
            function getStarString(count) {
                if (count === 0) return '⭐';
                if (count > 5) return '⭐⭐⭐⭐⭐'; // बहुत ज़्यादा स्टार्स होने पर लेआउट खराब न हो
                return '⭐'.repeat(count);
            }

            if (kidsData[key]) {
                let data = kidsData[key];
                output.innerText = key.toUpperCase();
                subtext.innerText = data.text;
                visualScratch.style.fontSize = "25vmax"; // इमोजी के लिए बहुत बड़ा साइज़
                visualScratch.innerText = data.emoji;
                speakText(data.speak);
            } 
            else if (!isNaN(key) && key !== " ") {
                let num = parseInt(key);
                output.innerText = key;
                subtext.innerText = `Number ${num}`;
                visualScratch.innerText = "⭐".repeat(num); // नंबर के हिसाब से स्टार्स
                
                // अगर नंबर 4 से ज्यादा है, तो स्टार्स का फॉन्ट साइज थोड़ा छोटा करें ताकि वे स्क्रीन में दिखें
                if(num > 4) {
                     visualScratch.style.fontSize = "12vmax"; 
                } else {
                     visualScratch.style.fontSize = "25vmax";
                }
                
                speakText(`Number ${num}`);
            } 
            else {
                output.innerText = event.key.toUpperCase();
                subtext.innerText = "Special Key";
                visualScratch.style.fontSize = "15vmax";
                visualScratch.innerText = "✨";
                speakText(event.key);
            }

            // छोटा सा एनिमेशन
            let screenBox = document.querySelector('.screen');
            screenBox.style.transform = "scale(1.02)";
            setTimeout(() => {
                screenBox.style.transform = "scale(1)";
            }, 150);
        });
    </script>
</body>
</html>
